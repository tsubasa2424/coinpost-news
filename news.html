<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CoinPost ニュース要約一覧</title>

    <style>
        body { font-family: Arial, sans-serif; background:#f1f1f1; padding:20px; }
        h1 { margin-bottom:20px; }
        .card {
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:12px;
            box-shadow:0 2px 6px rgba(0,0,0,0.15);
        }
        .card h2 { margin-top:0; }
        .date { color:#777; font-size:12px; margin-bottom:10px; }
        a { color:#0066cc; text-decoration:none; }
    </style>
</head>

<body>
    <h1>CoinPost ニュース要約一覧</h1>

    {% for n in news_list %}
    <div class="card">
        <h2>{{ n.title }}</h2>
        <div class="date">{{ n.created_at }}</div>
        <p>{{ n.summary }}</p>
        <p><a href="{{ n.url }}" target="_blank">記事を読む →</a></p>
    </div>
    {% endfor %}
</body>
</html>
